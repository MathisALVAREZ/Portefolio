# ═══════════════════════════════════════════════════════════
# docker-compose.yml — Portfolio
# Stack : Nginx + Certbot (Let's Encrypt)
# Usage : docker compose up -d
# ═══════════════════════════════════════════════════════════

services:

  # ─── NGINX ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Fichiers du site
      - ./site:/var/www/portfolio:ro

      # Config Nginx
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Certificats Let's Encrypt (partagés avec certbot)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

      # Logs persistants
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - certbot
    networks:
      - portfolio_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── CERTBOT ────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: portfolio_certbot
    restart: unless-stopped
    volumes:
      # Certificats (partagés avec nginx)
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./logs/certbot:/var/log/letsencrypt
    # Renouvellement automatique toutes les 12h
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    networks:
      - portfolio_net

networks:
  portfolio_net:
    driver: bridge
    name: portfolio_net

